name: CI

# Every test runs on the project's own test VPS through a self-hosted runner
# labelled psm-vps, and every job works inside a disposable container there, so
# the VPS itself only needs the runner and Docker. There is deliberately no
# pull_request trigger: code from a fork must never execute on that machine.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: syntax · ShellCheck · i18n · config regression
    if: github.repository == 'jinqians/proxy-stack'
    runs-on: [self-hosted, linux, psm-vps]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: scripts/ci.sh (Debian 13 container)
        run: |
          docker run --rm -v "$PWD:/src:ro" debian:13 bash -c '
            set -e
            apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq shellcheck jq openssl >/dev/null
            cp -a /src /w && cd /w && bash scripts/ci.sh'

  psm-agent:
    name: psm-agent (gofmt · go vet · test · amd64/arm64 builds)
    if: github.repository == 'jinqians/proxy-stack'
    runs-on: [self-hosted, linux, psm-vps]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: gofmt, go vet, go test, static builds (golang container)
        run: |
          docker run --rm -v "$PWD/agent:/src:ro" golang:1.27-alpine sh -c '
            set -e
            cp -a /src /w && cd /w
            unformatted=$(gofmt -l .)
            if [ -n "$unformatted" ]; then echo "not gofmt-formatted: $unformatted"; exit 1; fi
            go vet ./...
            go test -count=1 ./...
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOARCH=$arch go build -trimpath -ldflags "-s -w" -o /tmp/psm-agent-$arch .
            done
            ls -l /tmp/psm-agent-*'

  core-validate:
    name: generated configs vs real cores
    if: github.repository == 'jinqians/proxy-stack'
    runs-on: [self-hosted, linux, psm-vps]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: tests/core-validate.sh with pinned cores (Debian 13 container)
        run: |
          docker run --rm -v "$PWD:/src:ro" \
            -e XRAY_STABLE=v26.3.27 -e XRAY_PREVIEW=v26.9.9 -e SINGBOX=1.14.2 -e SINGBOX_PREVIEW=1.15.0-alpha.8 -e MIHOMO=v1.19.31 \
            debian:13 bash -c '
            set -euo pipefail
            apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl jq unzip openssl ca-certificates >/dev/null
            for ch in stable preview; do
              if [ "$ch" = stable ]; then tag="$XRAY_STABLE"; else tag="$XRAY_PREVIEW"; fi
              mkdir -p "/opt/cores/xray-$ch"
              curl -fsSL -o /tmp/xray.zip "https://github.com/XTLS/Xray-core/releases/download/${tag}/Xray-linux-64.zip"
              unzip -qo /tmp/xray.zip xray geoip.dat geosite.dat -d "/opt/cores/xray-$ch"
            done
            for v in "$SINGBOX" "$SINGBOX_PREVIEW"; do
              curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${v}/sing-box-${v}-linux-amd64.tar.gz" | tar xz -C /tmp
              install -m 755 "/tmp/sing-box-${v}-linux-amd64/sing-box" "/opt/cores/sing-box-${v}"
            done
            curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO}/mihomo-linux-amd64-compatible-${MIHOMO}.gz" | gunzip > /opt/cores/mihomo
            chmod 755 /opt/cores/mihomo
            cp -a /src /w && cd /w
            XRAY_BINS="/opt/cores/xray-stable/xray /opt/cores/xray-preview/xray" \
            SINGBOX_BIN="/opt/cores/sing-box-${SINGBOX}" MIHOMO_BIN=/opt/cores/mihomo \
              bash tests/core-validate.sh
            # the preview channel the installer offers for sing-box (the newest pre-release)
            XRAY_BINS=" " SINGBOX_BIN="/opt/cores/sing-box-${SINGBOX_PREVIEW}" MIHOMO_BIN=/nonexistent \
              bash tests/core-validate.sh'

  integration:
    name: ${{ matrix.os }} · ${{ matrix.suite }}
    if: github.repository == 'jinqians/proxy-stack'
    needs: checks
    runs-on: [self-hosted, linux, psm-vps]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: debian, suite: full }
          - { os: alpine, suite: full }
          - { os: debian, suite: nginx443 }
          - { os: alpine, suite: nginx443 }
          - { os: debian, suite: e2e }
          - { os: alpine, suite: e2e }
          - { os: alpine, suite: snell }
          - { os: debian, suite: users }
          - { os: alpine, suite: users }
          - { os: rocky9, suite: full }
          - { os: rocky9, suite: e2e }
          - { os: rocky9, suite: nginx443 }
          - { os: rocky9, suite: users }
          - { os: alma8,  suite: full }
          - { os: alma8,  suite: e2e }
          - { os: ubuntu24, suite: full }
          - { os: ubuntu24, suite: e2e }
          - { os: ubuntu22, suite: full }
          - { os: ubuntu22, suite: e2e }
          - { os: debian,   suite: slim }
          - { os: alpine,   suite: slim }
          - { os: alma8,    suite: slim }
          - { os: debian10, suite: slim }
          - { os: debian,   suite: retry }
          - { os: alpine,   suite: retry }
          - { os: alma8,    suite: retry }
          - { os: debian,   suite: panelside }
          - { os: alpine,   suite: panelside }
          - { os: rocky9,   suite: panelside }
    steps:
      - uses: actions/checkout@v4
      - name: tests/integration/container.sh ${{ matrix.os }} ${{ matrix.suite }}
        run: bash tests/integration/container.sh "${{ matrix.os }}" "${{ matrix.suite }}"

  migrate:
    name: migrate ${{ matrix.src }} → ${{ matrix.dst }} (${{ matrix.mode }})
    if: github.repository == 'jinqians/proxy-stack'
    needs: checks
    runs-on: [self-hosted, linux, psm-vps]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { src: debian, dst: alpine, mode: push }
          - { src: alpine, dst: debian, mode: file }
          - { src: debian, dst: rocky9, mode: push }
    steps:
      - uses: actions/checkout@v4
      - name: tests/integration/migrate.sh ${{ matrix.src }} ${{ matrix.dst }} ${{ matrix.mode }}
        run: bash tests/integration/migrate.sh "${{ matrix.src }}" "${{ matrix.dst }}" "${{ matrix.mode }}"
